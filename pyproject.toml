[project]
name = "chronicle"
version = "0.1.0"
description = "Chronic-illness check-ins -> cited symptom timeline, doctor summary, and an eval harness. Synthetic data only. Not medical advice."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chronicle"]

[tool.setuptools.package-data]
chronicle = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
